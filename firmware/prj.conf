# Bluetooth: scannable, non-connectable beacon
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="STN"
CONFIG_BT_EXT_ADV=n

# BC832 has no 32.768 kHz crystal on this board: internal RC with calibration
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Battery measurement (SAADC, internal VDD input)
CONFIG_ADC=y

# Power: no console, no logging, in production builds
CONFIG_PM_DEVICE=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_GPIO=n
